<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>行列之间 · 宣传演示</title><style>
:root{--bg:#f7f7f5;--paper:#fdfdfb;--surface:#f0f0ed;--strong:#e5e5e0;--ink:#252623;--muted:#62645f;--line:#dfdfd8;--math:"Cambria Math",Cambria,"Times New Roman",serif;--font:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden}.promo{min-height:100dvh;display:grid;place-items:center;padding:40px}.frame{width:min(1180px,94vw);text-align:center}.eyebrow{font-size:10px;color:var(--muted);letter-spacing:2px}.frame h1{font-size:clamp(28px,4vw,52px);line-height:1.18;font-weight:560;letter-spacing:-1px;margin:14px auto 26px}.stage{height:min(58vw,500px);min-height:300px;border:1px solid var(--line);border-radius:10px;position:relative;overflow:hidden;background:var(--paper);background-image:radial-gradient(var(--line) .7px,transparent .7px);background-size:17px 17px;box-shadow:0 15px 45px #25262308}.matrix{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-3deg);display:grid;grid-template-columns:repeat(2,94px);grid-auto-rows:70px;gap:7px;padding:13px;border-left:2px solid var(--ink);border-right:2px solid var(--ink);font:italic 22px var(--math);animation:matrix 7s both}.cell{display:grid;place-items:center;border-radius:5px;background:var(--strong);color:var(--ink);font-style:normal}.cell:nth-child(n+3){animation:zero 7s both}.flow{position:absolute;inset:auto 20px 22px;font-size:13px;letter-spacing:.5px;color:var(--muted);animation:flow 7s both}.answer{position:absolute;right:7%;top:10%;font:24px var(--math);opacity:0;animation:answer 7s both}.answer strong{font:11px var(--font);display:block;color:var(--muted);margin-top:4px}.caption{font-size:13px;color:var(--muted);margin:19px 0 14px}.replay{background:var(--ink);color:var(--paper);border:0;border-radius:5px;padding:11px 22px;cursor:pointer;font-size:12px}.replay:hover{background:var(--muted)}@keyframes matrix{0%,12%{transform:translate(-50%,-50%) rotate(-3deg) scale(.78);filter:blur(1px)}25%{transform:translate(-50%,-50%) rotate(-3deg) scale(1)}48%{transform:translate(-50%,-50%) rotate(0) scale(1.02)}100%{transform:translate(-50%,-50%) rotate(0) scale(1.02)}}@keyframes zero{0%,36%{opacity:1;transform:none}53%{opacity:.22;transform:translate(-7px,12px) scale(.82)}70%,100%{opacity:.35;transform:none}}@keyframes zero2{0%,48%{opacity:1}63%{opacity:.2;transform:translate(6px,14px) scale(.78)}77%,100%{opacity:.3;transform:none}}@keyframes zero3{0%,58%{opacity:1}75%{opacity:.14;transform:translate(-4px,9px) scale(.72)}88%,100%{opacity:.26;transform:none}}@keyframes flow{0%,20%{opacity:0;transform:translateY(10px)}38%,100%{opacity:1;transform:none}}@keyframes answer{0%,58%{opacity:0;transform:translateY(10px)}76%,100%{opacity:1;transform:none}}@media(max-width:700px){.promo{padding:18px}.stage{height:62vh}.matrix{grid-template-columns:repeat(2,62px);grid-auto-rows:50px;gap:5px;padding:9px;font-size:17px}.answer{right:6%;top:8%;font-size:19px}.caption{font-size:11px}}@media(prefers-reduced-motion:reduce){.matrix,.cell,.flow,.answer{animation:none!important;opacity:1!important;transform:translate(-50%,-50%) rotate(0)!important}.flow,.answer{transform:none!important}}
</style></head><body><main class="promo"><div class="frame"><div class="eyebrow">行列之间 · DETERMINANT LAB</div><h1>让每一次消元，<br>都变成看得见的动作。</h1><div class="stage"><div class="matrix" aria-label="第一关真实二阶矩阵"><i class="cell">1</i><i class="cell">2</i><i class="cell">3</i><i class="cell">4</i></div><div class="flow">行列汇入 → 零出现 → 三角结构 → 对角线读值</div><div class="answer">D = <strong>主对角线乘积</strong></div></div><p class="caption">这是实际游戏使用的纸面实验台视觉；宣传演示不会切换成另一套美术。</p><button class="replay" id="replay">重播演示</button></div></main><script>document.getElementById('replay').onclick=()=>location.reload();</script></body></html>
