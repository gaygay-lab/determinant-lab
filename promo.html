<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>行列之间 · 宣传演示</title><style>
:root{--bg:#1f211f;--paper:#f4f5ee;--muted:#aeb7aa;--green:#b9cba7;--yellow:#e7c85b;--font:"Segoe UI","Microsoft YaHei",sans-serif;--math:"Cambria Math",Cambria,serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--paper);font-family:var(--font);overflow:hidden}.promo{min-height:100dvh;display:grid;place-items:center;padding:40px}.frame{width:min(1160px,94vw);text-align:center}.eyebrow{letter-spacing:4px;font-size:11px;color:var(--muted)}h1{font-size:clamp(32px,5vw,72px);line-height:1.08;font-weight:500;letter-spacing:-2px;margin:20px auto 34px;max-width:800px}.stage{height:min(59vw,510px);min-height:310px;border:1px solid #656d62;border-radius:15px;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 42%,#495047,#232622 68%);box-shadow:0 30px 100px #0008}.stage:before{content:"";position:absolute;inset:0;background-image:radial-gradient(#dfe6d022 .8px,transparent .8px);background-size:17px 17px}.matrix{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-3deg);display:grid;grid-template-columns:repeat(4,72px);grid-auto-rows:54px;gap:8px;padding:16px;border-left:2px solid var(--paper);border-right:2px solid var(--paper);font:italic 26px var(--math);animation:matrix 7s both}.cell{display:grid;place-items:center;border-radius:6px;background:var(--green);color:#273025}.cell:nth-child(n+5){animation:zero 7s both}.cell:nth-child(n+9){animation:zero2 7s both}.cell:nth-child(n+13){animation:zero3 7s both}.flow{position:absolute;inset:auto 20px 25px;font-size:15px;letter-spacing:1px;color:var(--muted);animation:flow 7s both}.answer{position:absolute;right:6%;top:10%;font:26px var(--math);opacity:0;animation:answer 7s both}.answer strong{font:11px var(--font);display:block;color:var(--green);margin-top:5px}.caption{font-size:15px;color:var(--muted);margin:23px 0 17px}.replay{background:var(--paper);color:var(--bg);border:0;border-radius:6px;padding:12px 24px;cursor:pointer;font-size:13px}.replay:hover{background:white}@keyframes matrix{0%,12%{transform:translate(-50%,-50%) rotate(-3deg) scale(.78);filter:blur(1px)}25%{transform:translate(-50%,-50%) rotate(-3deg) scale(1)}48%{transform:translate(-50%,-50%) rotate(0) scale(1.02)}100%{transform:translate(-50%,-50%) rotate(0) scale(1.02)}}@keyframes zero{0%,36%{opacity:1;transform:none}53%{opacity:.22;transform:translate(-7px,12px) scale(.82)}70%,100%{opacity:.35;transform:none}}@keyframes zero2{0%,48%{opacity:1}63%{opacity:.2;transform:translate(6px,14px) scale(.78)}77%,100%{opacity:.3;transform:none}}@keyframes zero3{0%,58%{opacity:1}75%{opacity:.14;transform:translate(-4px,9px) scale(.72)}88%,100%{opacity:.26;transform:none}}@keyframes flow{0%,20%{opacity:0;transform:translateY(10px)}38%,100%{opacity:1;transform:none}}@keyframes answer{0%,58%{opacity:0;transform:translateY(10px)}76%,100%{opacity:1;transform:none}}@media(max-width:700px){.promo{padding:18px}.stage{height:62vh}.matrix{grid-template-columns:repeat(4,42px);grid-auto-rows:35px;gap:5px;padding:9px;font-size:17px}.answer{right:6%;top:8%;font-size:19px}.caption{font-size:12px}}
@media(prefers-reduced-motion:reduce){.matrix,.cell,.flow,.answer{animation:none!important;opacity:1!important;transform:translate(-50%,-50%) rotate(0)!important}.flow,.answer{transform:none!important}}
</style></head><body><main class="promo"><div class="frame"><div class="eyebrow">DETERMINANT LAB · A PLAYABLE LINEAR ALGEBRA STORY</div><h1>让每一次消元，<br>都变成看得见的动作。</h1><div class="stage"><div class="matrix" aria-label="一块从复杂到三角的行列式"><i class="cell">1</i><i class="cell">2</i><i class="cell">3</i><i class="cell">4</i><i class="cell">3</i><i class="cell">5</i><i class="cell">7</i><i class="cell">9</i><i class="cell">0</i><i class="cell">−2</i><i class="cell">4</i><i class="cell">6</i><i class="cell">0</i><i class="cell">0</i><i class="cell">1</i><i class="cell">−3</i></div><div class="flow">行列汇入 → 零出现 → 三角结构 → 对角线发光</div><div class="answer">D = <strong>主对角线乘积</strong></div></div><p class="caption">先看一遍完整变形，再亲手把答案写出来。</p><button class="replay" id="replay">重播演示</button></div></main><script>document.getElementById('replay').onclick=()=>{document.body.classList.remove('again');void document.body.offsetWidth;document.body.classList.add('again');location.reload()};</script></body></html>
